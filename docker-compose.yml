services:
  app:
    build:
      context: .
      args:
        # BASE_URL and ORIGIN are baked in at build time. Change them here (or
        # in .env) and rebuild with `docker compose build` for them to take effect.
        BASE_URL: '${BASE_URL:-}'
        ORIGIN: '${ORIGIN:-}'
    restart: unless-stopped
    # Runs unprivileged, with no extra capabilities. APP_UID / APP_GID (in
    # .env) choose which host uid:gid the process runs as and therefore who
    # must own ./data; they default to 1000:1000, the image's `node` user.
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      # SQLite database file — back this directory up regularly.
      # Must be writable by APP_UID: `sudo chown -R <uid>:<gid> ./data`.
      - ./data:/data
    env_file: .env
    environment:
      # Override DATABASE_URL so the file lives in the mounted volume.
      DATABASE_URL: /data/booking.db
      PORT: '${APP_PORT:-3000}'
      # The app port is bound to loopback, so requests arrive via a reverse
      # proxy. Set TRUSTED_PROXY=cloudflare in .env when behind Cloudflare.
      TRUSTED_PROXY: '${TRUSTED_PROXY:-proxy}'
      # A custom APP_UID has no home directory inside the image.
      HOME: /tmp
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://localhost:${PORT:-3000}${BASE_URL:-}/login']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Bind to loopback only — remove or change to "0.0.0.0:3000:3000" if you
    # need direct external access without the nginx proxy profile.
    # When using --profile proxy below this port is only needed for debugging.
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}'

  # Daily GDPR anonymisation job.
  # Runs the anonymisation sweep at 02:00 UTC every day using the same image and data
  # volume as the app service. Waits for the app to be healthy first so the
  # schema is always applied before the first sweep.
  anonymize:
    build:
      context: .
      args:
        BASE_URL: '${BASE_URL:-}'
        ORIGIN: '${ORIGIN:-}'
    restart: unless-stopped
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      DATABASE_URL: /data/booking.db
      # A custom APP_UID has no home directory inside the image.
      HOME: /tmp
    entrypoint: ['./docker-anonymize.sh']
    depends_on:
      app:
        condition: service_started

  # Optional nginx reverse proxy.
  # Start with:  docker compose --profile proxy up -d
  # When running behind nginx you can remove the ports block from the app
  # service above so port 3000 is not exposed to the host at all.
  nginx:
    image: nginx:alpine
    profiles: ['proxy']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Default: HTTPS. For HTTP-only dev/testing swap in nginx-insecure.conf.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount the Let's Encrypt directory so nginx can read the certificates:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
